[build]
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/notify-email"
  to = "/.netlify/functions/notify-email"
  status = 200

[[redirects]]
  from = "/api/admin/:action"
  to = "/.netlify/functions/admin?action=:action"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
