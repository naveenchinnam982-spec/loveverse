<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>LoveVerse 💖 Naveen</title>
<style>
/* ===== RESET ===== */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;background:#1a0035}
input,textarea,button,select{font-family:inherit}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:rgba(255,100,180,.5);border-radius:4px}

/* ===== LOVE COLOUR PALETTE =====
   Deep rose #c9184a
   Hot pink  #ff4d6d
   Blush     #ff85a1
   Soft pink #ffb3c1
   Cream     #fff0f3
   Deep plum #3d0b30
   Rich wine #6a0636
   Gold      #f8c630
   Lavender  #c77dff
   Purple    #7b2d8b
============================================ */

/* ===== BACKGROUND ===== */
#bg-wrap{position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,#1a0035 0%,#3d0b30 30%,#6a0636 60%,#1a0035 100%);background-size:400% 400%}

/* ===== FLOATING HEARTS (NO BLINK - uses transform only) ===== */
#hearts-layer{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.fheart{position:absolute;bottom:-80px;font-size:20px;animation:riseUp linear infinite;will-change:transform}
@keyframes riseUp{
  0%  {transform:translateY(0) rotate(0deg) scale(1);opacity:.8}
  50% {transform:translateY(-45vh) rotate(180deg) scale(1.1);opacity:.6}
  100%{transform:translateY(-105vh) rotate(360deg) scale(.8);opacity:0}
}

/* ===== NAV ===== */
#nav{position:fixed;top:0;left:0;right:0;z-index:300;background:rgba(26,0,53,.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,133,161,.2);padding:0 16px}
.nav-inner{max-width:1100px;margin:0 auto;height:58px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-size:22px;font-weight:900;cursor:pointer;letter-spacing:.5px;background:linear-gradient(90deg,#ff4d6d,#f8c630);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-right{display:flex;gap:8px;align-items:center}
.nav-icon-btn{background:rgba(255,77,109,.12);border:1px solid rgba(255,133,161,.25);border-radius:50px;padding:6px 14px;color:#ffb3c1;cursor:pointer;font-size:14px;transition:all .2s}
.nav-icon-btn:hover{background:rgba(255,77,109,.3);border-color:#ff4d6d;color:#fff}

/* Menu drawer */
#drawer{display:none;flex-wrap:wrap;gap:6px;padding:10px 16px 14px;border-top:1px solid rgba(255,133,161,.15);justify-content:center;max-width:1100px;margin:0 auto}
#drawer.open{display:flex}
.d-btn{background:none;border:1px solid rgba(255,133,161,.2);border-radius:50px;padding:6px 14px;color:#ffb3c1;cursor:pointer;font-size:12px;transition:all .2s}
.d-btn:hover,.d-btn.active{background:linear-gradient(135deg,#c9184a,#7b2d8b);color:#fff;border-color:transparent}

/* ===== MAIN CONTENT ===== */
#main{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:74px 16px 60px}

/* ===== CARDS ===== */
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,133,161,.2);border-radius:22px;backdrop-filter:blur(16px);padding:24px}
.card-rose{background:linear-gradient(135deg,rgba(201,24,74,.12),rgba(123,45,139,.12));border:1.5px solid rgba(255,77,109,.3);border-radius:22px;padding:24px}

/* ===== BUTTONS ===== */
.btn-love{background:linear-gradient(135deg,#c9184a,#7b2d8b);color:#fff;border:none;border-radius:50px;padding:13px 30px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 18px rgba(201,24,74,.35)}
.btn-love:hover{transform:scale(1.05);box-shadow:0 8px 26px rgba(201,24,74,.55)}
.btn-love:active{transform:scale(.97)}
.btn-love.sm{padding:8px 18px;font-size:13px}
.btn-love.gold{background:linear-gradient(135deg,#c9184a,#f8c630);box-shadow:0 4px 18px rgba(248,198,48,.3)}
.btn-outline{background:none;border:1px solid rgba(255,133,161,.35);border-radius:50px;padding:8px 20px;color:#ffb3c1;cursor:pointer;font-size:13px;transition:all .2s}
.btn-outline:hover{background:rgba(255,77,109,.15);border-color:#ff4d6d;color:#fff}
/* ===== BUTTONS ===== */
.btn-no{background:#1a0a12;border:1.5px solid rgba(255,133,161,.28);border-radius:50px;padding:13px 36px;color:#ff85a1;cursor:pointer;font-size:16px;font-weight:700;transition:background .2s,box-shadow .2s,border-color .2s;box-shadow:0 4px 16px rgba(0,0,0,.35);user-select:none;-webkit-tap-highlight-color:transparent}
.btn-no:hover{background:rgba(201,24,74,.25);border-color:#ff4d6d;color:#fff;box-shadow:0 6px 22px rgba(201,24,74,.4)}
.btn-no:active{transform:scale(.97)}
.btn-yes{background:linear-gradient(135deg,#c9184a,#e63950);color:#fff;border:none;border-radius:50px;padding:13px 44px;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 6px 24px rgba(201,24,74,.5);transition:transform .2s,box-shadow .2s}
.btn-yes:hover{transform:scale(1.1);box-shadow:0 10px 32px rgba(201,24,74,.7)}

/* ===== INPUTS ===== */
.inp{width:100%;padding:13px 18px;border-radius:14px;border:1px solid rgba(255,133,161,.25);background:rgba(255,255,255,.07);color:#fff0f3;font-size:14px;outline:none;transition:border .2s}
.inp:focus{border-color:#ff4d6d;background:rgba(255,77,109,.08)}
.inp::placeholder{color:rgba(255,179,193,.45)}
textarea.inp{resize:none}

/* ===== TYPOGRAPHY ===== */
.sec-title{font-size:clamp(24px,5vw,32px);font-weight:900;text-align:center;margin-bottom:24px;font-family:Georgia,serif;background:linear-gradient(135deg,#ff4d6d,#f8c630);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.muted{color:#c9899f}
.accent{color:#ff4d6d}
.gold{color:#f8c630}

/* ===== PROFILE ===== */
.prof-center{display:flex;flex-direction:column;align-items:center;margin-bottom:28px}
.ring-outer{width:148px;height:148px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center}
.ring-spin{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#ff4d6d,#f8c630,#c9184a,#7b2d8b,#ff4d6d);animation:ringRotate 5s linear infinite;will-change:transform}
@keyframes ringRotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.ring-gap{position:absolute;inset:4px;border-radius:50%;background:#1a0035;z-index:1}
.prof-photo{position:absolute;inset:9px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#c9184a,#7b2d8b);z-index:2}
.prof-photo img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;transform:none !important}
.prof-name{font-size:clamp(32px,7vw,52px);font-weight:900;letter-spacing:7px;text-transform:uppercase;font-family:Georgia,serif;background:linear-gradient(135deg,#ff4d6d,#f8c630,#ffb3c1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:14px 0 6px}
.prof-handle{display:flex;align-items:center;gap:7px;margin-bottom:18px}
.prof-handle .h-text{font-style:italic;font-size:16px;font-weight:700;background:linear-gradient(90deg,#f8c630,#ffb3c1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.bio-box{background:rgba(255,255,255,.05);border:1px solid rgba(255,133,161,.18);border-radius:20px;padding:20px 24px;max-width:340px;width:100%}
.bio-icons-row{display:flex;gap:12px;justify-content:center;margin-bottom:14px;font-size:22px}
.bio-line{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;font-size:14px;color:#ffe0e8;line-height:1.4}
.bio-line .ei{font-size:16px;min-width:22px;flex-shrink:0}

/* ===== BANNER ===== */
.banner-dec{position:absolute;inset:0;opacity:.06;font-size:48px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;pointer-events:none;overflow:hidden}
.ban-q{font-style:italic;font-size:clamp(22px,5vw,34px);font-weight:800;font-family:Georgia,serif;background:linear-gradient(135deg,#ff4d6d,#f8c630);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:8px 0}
.ban-btns{display:flex;justify-content:center;align-items:center;gap:22px;flex-wrap:wrap;margin-top:24px;position:relative;min-height:60px}

/* ===== GRID ===== */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.feat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;max-width:960px;margin:0 auto}

/* ===== FEATURE BTN ===== */
.feat-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,133,161,.18);border-radius:18px;padding:18px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;transition:all .25s;color:#ffe0e8;font-size:12px;font-weight:600}
.feat-btn:hover{transform:translateY(-6px);box-shadow:0 14px 32px rgba(201,24,74,.35);border-color:#ff4d6d;background:rgba(201,24,74,.12)}

/* ===== QUOTE CARD ===== */
.quote-card{background:linear-gradient(135deg,rgba(201,24,74,.1),rgba(123,45,139,.1));border:1px solid rgba(255,133,161,.2);border-radius:20px;padding:24px;max-width:580px;margin:0 auto 28px}

/* ===== GAME CARD ===== */
.game-card{border-radius:22px;overflow:hidden;cursor:pointer;transition:all .28s;border:1px solid rgba(255,133,161,.18);display:flex;flex-direction:column}
.game-card:hover{transform:translateY(-10px);border-color:var(--gc)}
.gc-body{padding:26px 16px 20px;text-align:center;flex:1}
.gc-tag{display:inline-block;font-size:10px;padding:3px 10px;border-radius:50px;font-weight:800;letter-spacing:1px;margin-bottom:9px}
.gc-title{font-size:16px;font-weight:800;margin:0 0 6px;font-family:Georgia,serif;color:#ffe0e8}
.gc-desc{color:#c9899f;font-size:12px}
.gc-play{padding:10px;color:#fff;font-size:13px;font-weight:800;text-align:center}

/* ===== QUIZ OPTS ===== */
.q-opt{background:rgba(255,255,255,.05);border:1px solid rgba(255,133,161,.2);border-radius:14px;padding:14px 18px;cursor:pointer;text-align:left;color:#ffe0e8;font-size:14px;transition:all .2s;width:100%;margin-bottom:10px;font-family:inherit;display:block}
.q-opt:hover{background:rgba(201,24,74,.18);border-color:#ff4d6d;transform:translateX(4px)}
.q-opt.correct{background:rgba(80,220,120,.22);border-color:#50dc78;color:#50dc78;cursor:default}
.q-opt.wrong{background:rgba(255,80,80,.22);border-color:#ff5050;color:#ff5050;cursor:default}

/* ===== PROGRESS BAR ===== */
.prog-wrap{height:8px;background:rgba(255,255,255,.1);border-radius:50px;overflow:hidden;margin-bottom:8px}
.prog-fill{height:100%;background:linear-gradient(90deg,#c9184a,#f8c630);border-radius:50px;transition:width .5s ease}

/* ===== BUCKET ===== */
.b-item{background:rgba(255,255,255,.05);border:1px solid rgba(255,133,161,.15);border-radius:14px;padding:13px 16px;display:flex;align-items:center;gap:12px;margin-bottom:9px}
.chk-circle{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,133,161,.3);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;color:#fff;transition:all .2s}
.chk-circle.done{background:linear-gradient(135deg,#c9184a,#7b2d8b);border-color:transparent}

/* ===== MEMORY CARD ===== */
.mc{height:78px;border-radius:14px;cursor:pointer;border:2px solid rgba(255,133,161,.18);background:rgba(255,255,255,.04);font-size:30px;transition:all .28s;display:flex;align-items:center;justify-content:center;user-select:none}
.mc:hover{border-color:rgba(255,77,109,.4)}
.mc.face-up{background:linear-gradient(135deg,rgba(201,24,74,.25),rgba(123,45,139,.25));border-color:rgba(255,77,109,.5);transform:scale(1.04)}
.mc.matched{background:linear-gradient(135deg,rgba(201,24,74,.15),rgba(123,45,139,.15));border-color:rgba(255,133,161,.4);opacity:.75}

/* ===== TTT ===== */
.ttt-cell{height:88px;border-radius:14px;font-size:34px;cursor:pointer;border:2px solid rgba(255,133,161,.18);background:rgba(255,255,255,.04);transition:all .2s;display:flex;align-items:center;justify-content:center;user-select:none}
.ttt-cell:hover:empty{background:rgba(201,24,74,.1);border-color:rgba(255,77,109,.3)}
.ttt-cell.win{background:linear-gradient(135deg,rgba(201,24,74,.35),rgba(123,45,139,.35));border-color:#ff4d6d;box-shadow:0 0 20px rgba(255,77,109,.5)}

/* ===== ADVENTURE ===== */
.adv-opt{background:rgba(255,255,255,.05);border:1px solid rgba(255,133,161,.2);border-radius:14px;padding:16px 20px;cursor:pointer;text-align:left;color:#ffe0e8;font-size:14px;transition:all .22s;width:100%;font-family:inherit;margin-bottom:10px;display:block}
.adv-opt:hover{background:rgba(201,24,74,.18);border-color:#ff4d6d;transform:translateX(6px)}

/* ===== COUNT TILES ===== */
.ct{text-align:center;padding:12px 8px;background:rgba(201,24,74,.12);border-radius:12px;border:1px solid rgba(255,133,161,.15)}
.ct-num{font-size:26px;font-weight:900;color:#ff4d6d}
.ct-lbl{font-size:10px;color:#c9899f;margin-top:2px}

/* ===== PILL ===== */
.pill{display:inline-block;font-size:11px;padding:3px 10px;border-radius:50px;font-weight:700}

/* ===== BACK ROW ===== */
.back-row{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.back-row h2{margin:0;font-size:22px;font-family:Georgia,serif;color:#ffe0e8;flex:1}

/* ===== HUD CHIP ===== */
.hud-chip{background:rgba(255,255,255,.07);border:1px solid rgba(255,133,161,.18);border-radius:50px;padding:6px 14px;font-size:13px;color:#ffb3c1}

/* ===== CONFETTI ===== */
#confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:999;display:none;overflow:hidden}
.conf-piece{position:absolute;top:-20px;border-radius:3px;animation:confDrop linear forwards}
@keyframes confDrop{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* ===== ANIMATIONS (NO BLINK) ===== */
@keyframes heartPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes slideIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes popUp{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes spinBall{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes floatBall{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes shimmer{0%,100%{opacity:.7}50%{opacity:1}}
.page-anim{animation:slideIn .3s ease}
.pop-anim{animation:popUp .4s cubic-bezier(.34,1.56,.64,1)}
.hb-anim{animation:heartPulse 1.8s ease-in-out infinite}

/* ===== LQ TIMER BAR ===== */
.lq-timer-bar{height:6px;background:rgba(255,255,255,.1);border-radius:50px;overflow:hidden;margin-bottom:18px}
.lq-timer-fill{height:100%;border-radius:50px;transition:width 1s linear,background .3s}

/* ===== FORTUNE CRYSTAL ===== */
.crystal-ball{width:160px;height:160px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f0c0ff,#c44dff 25%,#6600cc 55%,#2d0066 80%,#100022);display:flex;align-items:center;justify-content:center;font-size:70px;box-shadow:0 0 40px rgba(180,50,240,.6),0 0 80px rgba(100,0,200,.25);margin:0 auto 22px;animation:floatBall 3s ease-in-out infinite}
.crystal-ball.gazing{animation:spinBall 1.2s linear infinite;background:conic-gradient(#c9184a,#f8c630,#ff4d6d,#7b2d8b,#c9184a)}

/* ===== RESPONSIVE ===== */
@media(max-width:640px){
  .g2{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,1fr)}
  .games-grid{grid-template-columns:repeat(2,1fr)}
  .ban-btns{gap:14px}
  .prof-name{letter-spacing:3px}
  #main{padding:70px 12px 60px}
}
@media(max-width:360px){
  .games-grid{grid-template-columns:1fr}
  .feat-grid{grid-template-columns:repeat(3,1fr)}
}

/* ===== MUSIC WIDGET ===== */
.music-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.music-btn.playing{background:rgba(255,77,109,.35);border-color:#ff4d6d;color:#fff;box-shadow:0 0 14px rgba(255,77,109,.5)}
.music-bars{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.music-bar{width:2px;background:#f8c630;border-radius:1px;animation:musicWave .8s ease infinite alternate}
.music-bar:nth-child(2){animation-delay:.2s;height:60%}
.music-bar:nth-child(3){animation-delay:.4s;height:100%}
@keyframes musicWave{0%{height:20%}100%{height:100%}}

/* ===== INTERACTIVE ENVELOPE ===== */
.env-container{position:relative;width:290px;height:190px;margin:24px auto;perspective:800px;cursor:pointer}
.env-back{position:absolute;inset:0;background:linear-gradient(135deg,#c9184a,#7b2d8b);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.env-flap{position:absolute;top:0;left:0;right:0;height:95px;background:linear-gradient(135deg,#e63950,#a32060);clip-path:polygon(0 0, 100% 0, 50% 100%);transform-origin:top;transition:transform .6s ease;z-index:3}
.env-container.open .env-flap{transform:rotateX(180deg);z-index:1}
.env-pocket{position:absolute;bottom:0;left:0;right:0;height:105px;background:linear-gradient(135deg,#c9184a,#5e0d3e);clip-path:polygon(0 100%, 100% 100%, 100% 0, 50% 60%, 0 0);z-index:3;border-radius:0 0 14px 14px}
.env-paper{position:absolute;left:14px;right:14px;bottom:12px;height:160px;background:#fff8fa;border-radius:8px;padding:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .6s ease;z-index:2;overflow:hidden;color:#2c0c1e;font-family:Georgia,serif;font-size:11.5px;line-height:1.45}
.env-container.open .env-paper{transform:translateY(-80px);box-shadow:0 12px 28px rgba(201,24,74,.4);z-index:4}
.env-seal{position:absolute;top:76px;left:50%;transform:translateX(-50%);width:36px;height:36px;background:#f8c630;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 3px 10px rgba(0,0,0,.4);z-index:4;transition:opacity .3s}
.env-container.open .env-seal{opacity:0;pointer-events:none}

/* ===== GALLERY & LIGHTBOX ===== */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;max-width:960px;margin:20px auto}
.gallery-item{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,133,161,.2);border-radius:20px;overflow:hidden;cursor:pointer;transition:all .3s ease;position:relative}
.gallery-item:hover{transform:translateY(-8px);border-color:#ff4d6d;box-shadow:0 14px 30px rgba(201,24,74,.4)}
.gallery-thumb{width:100%;height:210px;object-fit:cover;display:block;transition:transform .4s}
.gallery-item:hover .gallery-thumb{transform:scale(1.05)}
.gallery-info{padding:14px 16px;background:rgba(26,0,53,.85)}
.gallery-title{font-weight:800;color:#ffe0e8;font-size:15px;margin-bottom:4px}
.gallery-caption{font-size:12px;color:#c9899f}
.lightbox-modal{position:fixed;inset:0;background:rgba(10,0,22,.94);backdrop-filter:blur(15px);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;flex-direction:column}
.lightbox-modal.active{display:flex;animation:fadeIn .3s ease}
.lightbox-content{max-width:90vw;max-height:75vh;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.85);object-fit:contain}
.lightbox-nav{display:flex;align-items:center;gap:20px;margin-top:16px}
.lb-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,133,161,.3);color:#fff;border-radius:50%;width:44px;height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;transition:all .2s}
.lb-btn:hover{background:#ff4d6d;border-color:#ff4d6d;transform:scale(1.08)}
.lb-close{position:absolute;top:20px;right:24px;background:none;border:none;color:#ff85a1;font-size:32px;cursor:pointer;line-height:1}

/* ===== FEATURED COUNTDOWN ===== */
.feat-cd-box{background:linear-gradient(135deg,rgba(201,24,74,.15),rgba(123,45,139,.18));border:1.5px solid rgba(255,77,109,.35);border-radius:22px;padding:22px;max-width:620px;margin:20px auto 28px;text-align:center}
.cd-grid-live{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.cd-cell{background:rgba(255,255,255,.07);border-radius:14px;padding:12px 6px;border:1px solid rgba(255,133,161,.2);box-shadow:inset 0 0 14px rgba(255,77,109,.15)}
.cd-val{font-size:clamp(24px,5vw,34px);font-weight:900;background:linear-gradient(135deg,#ff4d6d,#f8c630);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-family:Georgia,serif}
.cd-tag{font-size:11px;color:#c9899f;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-top:4px}

/* ===== ROMANTIC SURPRISE MODAL ===== */
.surprise-modal{position:fixed;inset:0;background:rgba(15,0,30,.88);backdrop-filter:blur(10px);z-index:9998;display:none;align-items:center;justify-content:center;padding:16px}
.surprise-modal.active{display:flex;animation:popUp .35s ease}
.surprise-card{background:linear-gradient(135deg,#2e0523,#4d0838);border:2px solid #ff4d6d;border-radius:24px;padding:32px 24px;max-width:480px;width:100%;text-align:center;position:relative;box-shadow:0 14px 45px rgba(201,24,74,.5)}

/* ===== ACCESSIBILITY PREFERS-REDUCED-MOTION ===== */
@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

    bucket:renderBucket,wheel:renderWheel,secret:renderSecret,

    tttGame:renderTTTGame,tdGame:renderTDGame,advGame:renderAdvGame,ftGame:renderFTGame

  if(currentPage==="wheel")drawWheel(wheelRot);
  if(currentPage==="countdown")startCdTick();
  if(currentPage==="lqGame"&&!lqDone)startLQTimer();
}

function doCalc(){

  if(!n1||!n2)return;
  $("calc-out").innerHTML=`<div style="text-align:center;padding:22px"><div class="hb-anim" style="font-size:40px;display:inline-block">💖</div><p class="muted" style="margin-top:10px">Consulting the stars…</p></div>`;
  setTimeout(()=>{
    const s=(n1+n2).toLowerCase();let h=0;
    for(const c of s)h=(h*31+c.charCodeAt(0))%100;
    calcPct=Math.max(42,(h+s.length*3)%100);
    $("calc-out").innerHTML=calcResultHTML(calcPct);
  },1600);
}
function calcResultHTML(p){

  return `<div style="text-align:center;animation:slideIn .5s ease">

function renderWheel(){$("root").innerHTML=`<div class="sec-title">🎡 Spin The Love Wheel</div>
  <div class="card" style="max-width:500px;margin:0 auto;text-align:center;padding:28px">
    <canvas id="wcanvas" width="320" height="320" onclick="spinWheel()" style="border-radius:50%;box-shadow:0 0 40px rgba(201,24,74,.5),0 0 80px rgba(123,45,139,.25);cursor:pointer;max-width:100%;display:block;margin:0 auto"></canvas>
    <div style="margin-top:20px"><button class="btn-love gold" id="spin-btn" onclick="spinWheel()" style="font-size:16px;padding:13px 40px">🎡 Spin Now!</button></div>
    <div id="wheel-result"></div>
  </div>`;}
function drawWheel(rot){
  const c=$("wcanvas");if(!c)return;
  const ctx=c.getContext("2d");
  const cx=160,cy=160,r=148,n=WHEEL_ITEMS.length,sl=2*Math.PI/n;
  ctx.clearRect(0,0,320,320);
  for(let i=0;i<n;i++){
    const s=rot+i*sl;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,s,s+sl);ctx.closePath();
    ctx.fillStyle=WHEEL_COLS[i%WHEEL_COLS.length];ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.15)";ctx.lineWidth=1.5;ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(s+sl/2);
    ctx.textAlign="right";ctx.fillStyle="#fff";ctx.font="bold 9px sans-serif";
    ctx.shadowColor="rgba(0,0,0,.4)";ctx.shadowBlur=2;
    ctx.fillText(WHEEL_ITEMS[i].replace(/[^ -~]/g,"").substring(0,16),r-10,4);
    ctx.restore();
  }
  ctx.beginPath();ctx.arc(cx,cy,22,0,2*Math.PI);ctx.fillStyle="#fff";ctx.shadowColor="rgba(201,24,74,.5)";ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle="#c9184a";ctx.font="bold 17px serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("💖",cx,cy);
  ctx.beginPath();ctx.moveTo(cx+r+6,cy);ctx.lineTo(cx+r-10,cy-9);ctx.lineTo(cx+r-10,cy+9);ctx.closePath();ctx.fillStyle="#fff";ctx.fill();
}
function spinWheel(){
  if(wheelSpinning)return;
  wheelSpinning=true;
  const btn=$("spin-btn");if(btn)btn.textContent="🌀 Spinning…";
  $("wheel-result").innerHTML="";
  const extra=(8+Math.random()*8)*Math.PI*2,dur=3800+Math.random()*2200;
  const t0=performance.now(),r0=wheelRot,target=r0+extra;
  function frame(now){
    const p=Math.min((now-t0)/dur,1),ease=1-Math.pow(1-p,4),cur=r0+(target-r0)*ease;
    wheelRot=cur;drawWheel(cur);
    if(p<1){requestAnimationFrame(frame);}
    else{
      wheelSpinning=false;if(btn)btn.textContent="🎡 Spin Now!";
      const norm=((cur%(Math.PI*2))+(Math.PI*2))%(Math.PI*2);
      const idx=Math.floor(((Math.PI*2-norm)/(Math.PI*2))*WHEEL_ITEMS.length)%WHEEL_ITEMS.length;
      const wr=$("wheel-result");
      if(wr)wr.innerHTML=`<div style="margin-top:20px;padding:20px;background:linear-gradient(135deg,rgba(201,24,74,.2),rgba(123,45,139,.2));border-radius:16px;border:1px solid rgba(255,77,109,.3);animation:slideIn .5s ease">
        <div style="font-size:12px;color:#f8c630;margin-bottom:6px;font-weight:700;letter-spacing:1px">🎉 YOUR CHALLENGE:</div>
        <div style="font-size:17px;font-weight:700;color:#ffe0e8">${WHEEL_ITEMS[idx]}</div>
      </div>`;
    }
  }
  requestAnimationFrame(frame);
}

  if(hcRaf)cancelAnimationFrame(hcRaf);
  hcRaf=requestAnimationFrame(hcLoop);
}
function hcLoop(){
  const cv=$("hc-cv");if(!cv||!hcRunning){hcRaf=null;return;}
  const ctx=cv.getContext("2d");
  hcTick++;
  const rate=Math.max(16,46-Math.floor(hcScore/5));
  if(hcTick%rate===0){
    const bad=Math.random()<.25;
    hcObjs.push({x:22+Math.random()*336,y:-34,vy:hcSpeed+Math.random()*1.8,emoji:bad?"💔":"💖",bad,sz:26+Math.random()*14});
  }
  hcSpeed=3+hcScore*.07;
  // Draw bg
  const g=ctx.createLinearGradient(0,0,0,420);g.addColorStop(0,"#1a0035");g.addColorStop(1,"#3d0b30");
  ctx.fillStyle=g;ctx.fillRect(0,0,380,420);
  // Sparkles
  for(let i=0;i<2;i++){ctx.beginPath();ctx.arc(Math.random()*380,Math.random()*420,Math.random()*1.2,0,Math.PI*2);ctx.fillStyle="rgba(255,133,161,.3)";ctx.fill();}
  // Objects
  hcObjs=hcObjs.filter(o=>{
    o.y+=o.vy;
    if(o.y>450){if(!o.bad){hcLives--;if(hcLives<=0){hcRunning=false;hcGameOver(ctx);return false;}}return false;}
    ctx.save();ctx.font=o.sz+"px serif";ctx.globalAlpha=.9;ctx.fillText(o.emoji,o.x-o.sz/2,o.y);ctx.globalAlpha=1;ctx.restore();
    return true;
  });
  if(!hcRunning)return;
  // HUD
  ctx.fillStyle="rgba(26,0,53,.7)";ctx.fillRect(0,0,380,44);
  ctx.fillStyle="#ff4d6d";ctx.font="bold 15px sans-serif";ctx.textAlign="left";ctx.fillText("Score: "+hcScore,12,28);
  ctx.textAlign="right";ctx.fillText("❤️".repeat(Math.max(0,hcLives)),368,28);
  hcRaf=requestAnimationFrame(hcLoop);
}
function hcGameOver(ctx){
  ctx.fillStyle="rgba(26,0,53,.9)";ctx.fillRect(0,0,380,420);
  ctx.fillStyle="#ff4d6d";ctx.font="bold 28px Georgia";ctx.textAlign="center";ctx.fillText("Game Over! 💔",190,175);
  ctx.fillStyle="#fff";ctx.font="bold 22px sans-serif";ctx.fillText("Score: "+hcScore,190,218);
  ctx.fillStyle="#c9899f";ctx.font="15px sans-serif";ctx.fillText("Tap to play again",190,258);
  const cv=$("hc-cv");if(cv)cv.onclick=()=>{cv.onclick=hcClick;startHC();};
}
function hcClick(e){
  if(!hcRunning)return;
  const cv=$("hc-cv");if(!cv)return;
  const rect=cv.getBoundingClientRect(),scale=380/rect.width;
  const mx=(e.clientX-rect.left)*scale,my=(e.clientY-rect.top)*scale;
  let hit=false;
  hcObjs=hcObjs.filter(o=>{
    if(!hit&&Math.abs(mx-o.x)<o.sz&&Math.abs(my-o.y)<o.sz){
      hit=true;
      if(o.bad){hcLives--;if(hcLives<=0){hcRunning=false;const cv2=$("hc-cv");if(cv2)hcGameOver(cv2.getContext("2d"));}}
      else hcScore++;
      return false;
    }
    return true;
  });
}

  </div>`:
  `<div style="max-width:400px;margin:0 auto">

  </div>`}`;}
function flipMC(id){
  if(mmLocked)return;
  const card=mmCards.find(c=>c.id===id);
  if(!card||card.f||card.m)return;
  if(!mmStarted){
    mmStarted=true;
    mmTimerID=setInterval(()=>{mmTime++;const el=document.querySelector(".hud-chip b.accent:last-child");renderMMGame();},1000);
  }
  card.f=true;mmSel.push(id);
  if(mmSel.length===2){
    mmMoves++;mmLocked=true;
    const[a,b]=mmSel.map(s=>mmCards.find(c=>c.id===s));
    setTimeout(()=>{
      if(a.emoji===b.emoji){a.m=true;b.m=true;if(mmCards.every(c=>c.m)){mmWon=true;if(mmTimerID)clearInterval(mmTimerID);}}
      else{a.f=false;b.f=false;}
      mmSel=[];mmLocked=false;renderMMGame();
    },900);
  } else renderMMGame();
}

const TTT_LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

}

// ╔══════════════════════════════════════════════════════════════════╗
// ║  ADVANCED FEATURE: ROMANTIC MUSIC SYNTHESIZER (WEB AUDIO API)   ║
// ╚══════════════════════════════════════════════════════════════════╝
let audioCtx = null;
let musicPlaying = false;
let musicMuted = false;
let musicInterval = null;

function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
}

// Romantic chord melody progression (soothing harp & music box frequencies)
const ROMANTIC_MELODY = [
  261.63, 329.63, 392.00, 493.88, 523.25, // C4, E4, G4, B4, C5
  220.00, 261.63, 329.63, 392.00, 440.00, // A3, C4, E4, G4, A4
  174.61, 220.00, 261.63, 329.63, 349.23, // F3, A3, C4, E4, F4
  196.00, 246.94, 293.66, 392.00, 493.88  // G3, B3, D4, G4, B4
];
let melodyStep = 0;

function playRomanticNote(freq, dur = 1.3) {
  if (!audioCtx || musicMuted || !musicPlaying) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.08);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

function startMelodyLoop() {
  if (musicInterval) clearInterval(musicInterval);
  musicInterval = setInterval(() => {
    if (!musicPlaying) return;
    const freq = ROMANTIC_MELODY[melodyStep % ROMANTIC_MELODY.length];
    playRomanticNote(freq, 1.4);
    melodyStep++;
  }, 420);
}

function toggleRomanticMusic() {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  const customAudio = $("bgMusicAudio");
  if (musicPlaying) {
    musicPlaying = false;
    if (musicInterval) clearInterval(musicInterval);
    if (customAudio) customAudio.pause();
    updateMusicUI();
  } else {
    musicPlaying = true;
    if (customAudio && customAudio.src) {
      customAudio.play().catch(() => {});
    }
    startMelodyLoop();
    updateMusicUI();
  }
}

function toggleMusicMute() {
  musicMuted = !musicMuted;
  const customAudio = $("bgMusicAudio");
  if (customAudio) customAudio.muted = musicMuted;
  updateMusicUI();
}

function updateMusicUI() {
  const btn = $("musicToggleBtn");
  const icon = $("musicIcon");
  const text = $("musicText");
  const bars = $("musicBars");
  if (!btn) return;
  if (musicPlaying) {
    btn.classList.add("playing");
    if (icon) icon.textContent = musicMuted ? "🔇" : "⏸";
    if (text) text.textContent = musicMuted ? "Muted" : "Playing";
    if (bars) bars.style.display = "inline-flex";
  } else {
    btn.classList.remove("playing");
    if (icon) icon.textContent = "🎵";
    if (text) text.textContent = "Music";
    if (bars) bars.style.display = "none";
  }
}

function updateSpecialCountdown() {
  const diff = new Date(SPECIAL_COUNTDOWN_DATE) - new Date();
  const dEl = $("scd-days");
  const hEl = $("scd-hours");
  const mEl = $("scd-mins");
  const sEl = $("scd-secs");
  const statusEl = $("scd-status");
  if (!dEl) return;
  if (diff <= 0) {
    if (statusEl) statusEl.innerHTML = "🎉 Our Special Day Has Arrived! 💖✨";
    if (dEl) dEl.textContent = "0";
    if (hEl) hEl.textContent = "00";
    if (mEl) mEl.textContent = "00";
    if (sEl) sEl.textContent = "00";
    return;
  }
  const dv = Math.floor(diff / 86400000);
  const hv = Math.floor((diff % 86400000) / 3600000);
  const mv = Math.floor((diff % 3600000) / 60000);
  const sv = Math.floor((diff % 60000) / 1000);
  dEl.textContent = dv;
  hEl.textContent = pad2(hv);
  mEl.textContent = pad2(mv);
  sEl.textContent = pad2(sv);
}
setInterval(updateSpecialCountdown, 1000);

let letterOpened = false;
function toggleInteractiveLetter() {
  letterOpened = !letterOpened;
  const env = $("interactiveEnvelope");
  const btn = $("openLetterBtn");
  const textCard = $("letterFullCard");
  if (env) {
    if (letterOpened) {
      env.classList.add("open");
      if (btn) btn.innerHTML = "Fold & Close Letter ✉️";
      if (textCard) {
        textCard.style.display = "block";
        textCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      triggerCelebrationHearts();
    } else {
      env.classList.remove("open");
      if (btn) btn.innerHTML = "Open Love Letter 💌";
      if (textCard) textCard.style.display = "none";
    }
  }
}

function openLightbox(idx) {
  currentLightboxIdx = idx;
  const modal = $("lightboxModal");
  const img = $("lightboxImg");
  const title = $("lightboxTitle");
  const desc = $("lightboxDesc");
  if (!modal || !img) return;
  const item = GALLERY_ITEMS[currentLightboxIdx];
  img.src = item.src;
  img.alt = item.title;
  if (title) title.textContent = item.title;
  if (desc) desc.textContent = item.desc;
  modal.classList.add("active");
  document.body.style.overflow = "hidden";
}

function closeLightbox() {
  const modal = $("lightboxModal");
  if (modal) modal.classList.remove("active");
  document.body.style.overflow = "";
}

function nextLightbox(e) {
  if (e) e.stopPropagation();
  currentLightboxIdx = (currentLightboxIdx + 1) % GALLERY_ITEMS.length;
  openLightbox(currentLightboxIdx);
}

function prevLightbox(e) {
  if (e) e.stopPropagation();
  currentLightboxIdx = (currentLightboxIdx - 1 + GALLERY_ITEMS.length) % GALLERY_ITEMS.length;
  openLightbox(currentLightboxIdx);
}
